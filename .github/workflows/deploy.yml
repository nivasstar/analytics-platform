name: Deploy Analytics Platform

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build site
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python run_report.py config/reports/market_risk.yaml
          python run_report.py config/reports/economic_history.yaml
          python run_report.py config/reports/forecasts_vs_facts.yaml
          python run_report.py config/reports/decisions_vs_outcomes.yaml
          python build_interactive_dashboard.py
          python build_site.py





      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
