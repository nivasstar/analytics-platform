name: Repository Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
          sudo install /tmp/gitleaks/gitleaks /usr/local/bin/gitleaks

      - name: Scan Git history
        run: |
          gitleaks git . --redact --exit-code 1 --report-format json --report-path /tmp/gitleaks-report.json

      - name: Summarize findings safely
        if: always()
        run: |
          python - <<'PYREPORT'
          import json
          from pathlib import Path

          p = Path('/tmp/gitleaks-report.json')
          if not p.exists():
              print('No JSON report available')
              raise SystemExit(0)

          findings = json.loads(p.read_text())
          print('Potential findings:', len(findings))

          for f in findings:
              print('Rule:', f.get('RuleID'))
              print('File:', f.get('File'))
              print('Line:', f.get('StartLine'))
              print('Commit:', f.get('Commit'))
              print('---')
          PYREPORT
